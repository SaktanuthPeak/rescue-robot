# Overlay for a Pi with the Arduino actually plugged in.
#
#   docker compose -f docker-compose.yml -f docker-compose.serial.yml up -d --build
#
# Kept separate because `devices:` is a hard requirement: compose refuses to start the
# container when the path does not exist, which would break every mock/bench run.
#
# Find the host dialout gid with `getent group dialout | cut -d: -f3` (20 on Raspberry
# Pi OS) and set SERIAL_GROUP_ID in .env if it differs.

services:
  backend:
    environment:
      TELEMETRY_SOURCE: serial
    devices:
      - "${FLAME_SERIAL_PORT:-/dev/ttyACM0}:${FLAME_SERIAL_PORT:-/dev/ttyACM0}"
    # group_add instead of `privileged: true` -- the container only needs read/write on
    # one tty, not the whole host device tree.
    group_add:
      - "${SERIAL_GROUP_ID:-20}"
    # The serial reader holds the port open and needs to close it on SIGTERM; give it
    # room before the kill so the Arduino is not left mid-frame on the next boot.
    stop_grace_period: 20s
