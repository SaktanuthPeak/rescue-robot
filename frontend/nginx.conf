# Serves the prerendered SvelteKit bundle and reverse-proxies the FastAPI backend on the
# same origin, so the browser never has to be told a second host (and CORS stays a
# non-issue on the robot's offline access point).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream firebot_api {
    server backend:9000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Pi is a low-power box on a local network; gzip costs less than the bytes.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Telemetry stream: no buffering, and a read timeout longer than any gap between
    # frames so idle sockets are not culled mid-run. `=` (exact match) is load-bearing:
    # a plain prefix location would lose to the regex location below, and the upgrade
    # headers would be dropped.
    location = /v1/telemetry/ws {
        proxy_pass http://firebot_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(v1|docs|redoc|openapi\.json) {
        proxy_pass http://firebot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite assets are immutable; everything else must stay revalidated so a
    # redeploy is visible without clearing the tablet's cache.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        # trailingSlash: 'always' -> pages are prerendered as <route>/index.html.
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
