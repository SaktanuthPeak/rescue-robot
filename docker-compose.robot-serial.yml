# USB serial override for firmware/receiver-canbus.
#
#   docker compose -f docker-compose.yml -f docker-compose.rpi-ap.yml \
#     -f docker-compose.robot-serial.yml up -d --build

services:
  backend:
    environment:
      ROBOT_SERIAL_ENABLED: "True"
      # RB3 contains motor, arm, battery and all four flame ADC values.
      # The receiver service is the only owner of this USB serial port.
      TELEMETRY_SOURCE: "receiver"
    devices:
      - "${ROBOT_SERIAL_PORT:-/dev/ttyACM0}:${ROBOT_SERIAL_PORT:-/dev/ttyACM0}"
    group_add:
      - "${SERIAL_GROUP_ID:-20}"
    stop_grace_period: 20s
